name: Analyze and test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: qippet-pets-analyze-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Android pet drawable resources
        run: python3 tool/sync_pet_assets.py --check

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate missing Gradle wrapper JAR
        shell: bash
        run: |
          flutter create --platforms=android --org com.squiraldot --project-name qippet_pets --no-pub "$RUNNER_TEMP/qippet-wrapper"
          mkdir -p android/gradle/wrapper
          cp "$RUNNER_TEMP/qippet-wrapper/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
