name: Qippet Pets CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: qippet-pets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sprite generator dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Generate placeholder pet sprites
        run: python tool/generate_placeholder_pets.py

      - name: Synchronize Android drawable resources
        run: |
          python tool/sync_pet_assets.py
          python tool/sync_pet_assets.py --check

      - name: Commit generated PNG assets on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add assets/pets android/app/src/main/res/drawable-nodpi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: generate placeholder pet sprite assets"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check generated Android resources
        run: python tool/sync_pet_assets.py --check

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: flutter build apk --release

      - name: Upload APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: qippet-pets-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
