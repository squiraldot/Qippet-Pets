name: Qippet Pets CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: qippet-pets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    name: Build and publish Android APK
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Flutter-compatible Android Gradle host
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/qippet-overrides"
          cp android/app/build.gradle.kts "$RUNNER_TEMP/qippet-overrides/build.gradle.kts"
          cp android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/qippet-overrides/AndroidManifest.xml"
          cp android/app/src/main/kotlin/com/squiraldot/qippet_pets/MainActivity.kt "$RUNNER_TEMP/qippet-overrides/MainActivity.kt"
          cp android/app/src/main/res/values/styles.xml "$RUNNER_TEMP/qippet-overrides/styles.xml"

          flutter create --platforms=android --org com.squiraldot --project-name qippet_pets --no-pub "$RUNNER_TEMP/qippet-template"
          rm -rf android
          cp -R "$RUNNER_TEMP/qippet-template/android" android
          cp "$RUNNER_TEMP/qippet-overrides/build.gradle.kts" android/app/build.gradle.kts
          cp "$RUNNER_TEMP/qippet-overrides/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml
          cp "$RUNNER_TEMP/qippet-overrides/MainActivity.kt" android/app/src/main/kotlin/com/squiraldot/qippet_pets/MainActivity.kt
          cp "$RUNNER_TEMP/qippet-overrides/styles.xml" android/app/src/main/res/values/styles.xml
          chmod +x android/gradlew

      - name: Configure optional release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "Using configured release keystore."
          else
            rm -f android/key.properties android/app/upload-keystore.jks
            echo "Signing secrets are incomplete or absent; using debug signing."
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qippet-pets-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling latest prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Qippet Pets — Latest Android build
          prerelease: true
          make_latest: false
          update_tag: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
